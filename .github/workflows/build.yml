name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: raanana-club-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK into repo (apk-output branch)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/raanana-club.apk
          git add -f dist/raanana-club.apk
          git commit -m "APK build output [skip ci]"
          git push origin HEAD:apk-output --force
